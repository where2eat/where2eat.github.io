    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.6.3/dist/css/foundation.min.css"
      integrity="sha256-ogmFxjqiTMnZhxCqVmcqTvjfe1Y/ec4WaRj/aQPvn+I=" crossorigin="anonymous" />

    <meta property="og:image" content="https://where2eat.github.io/Assets/food.jpg">
    <meta property="og:image:type" content="image/jpg">
    <meta property="og:image:width" content="200">
    <meta property="og:image:height" content="200">
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://where2eat.github.io"/>
    <meta property="og:title" content="Where2Eat? Support local eateries in your neighborhood!" />
    <meta property="og:description" content="Where2Eat? Support local eateries in your neighborhood!" />
    <meta name="author" content="Chuck Konkol">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where 2 Eat?</title>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
      integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.6.3/dist/js/foundation.min.js"
      integrity="sha256-pRF3zifJRA9jXGv++b06qwtSqX1byFQOLjqa2PTEb2o=" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
    <style>
      body { background-image: url("./Assets/food.jpg"); background-size: cover; background-attachment: fixed; }
      .stars { color: #f5a623; letter-spacing: 1px; }
      .detail-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; }
      .detail-row:last-child { border-bottom: none; }
      .detail-label { font-weight: bold; min-width: 110px; }
    </style>
  </head>

  <body>
    <div class="container-fluid">
      <h2>Where 2 Eat?</h2>
    </div>

    <!-- Location / Action -->
    <div class="grid-x grid margin-x">
      <div id="form-container" class="cell medium-6">
        <h1>Support Local Eateries!</h1>
        <p>Tap GO!<br>Get a random local eatery in your neighborhood!<br></p>
        <button class="button" id="go" onclick="getLocation()">GO!</button>
        <div id="loading" style="display:none">
          <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
          Searching…&nbsp; getting eatery…&nbsp; getting weather…
        </div>
      </div>
    </div>

    <!-- Results -->
    <div class="grid-x grid margin-x">
      <div id="results-container" class="cell medium-6" style="display:none">
        <h1>Where 2 Eat?</h1>
        <div id="cityinfo-div"></div>
        <h3>Your perfect eatery awaits:</h3>
        <div id="restaurantinfo-div"></div>
        <div id="below"></div>
      </div>
    </div>

    <script src="script.js"></script>
    <footer class="footer-text">© Copyright 2023 <a href="mailto:ckonkol@gmail.com">Chuck Konkol</a> ~ Support &amp; Buy Local!</footer>
  </body>
</html>
